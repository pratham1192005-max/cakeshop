# Nginx config for the WEB TIER (EC2 in a public subnet, behind the ALB).
# Install:  sudo cp deploy/nginx/cakeshop.conf /etc/nginx/conf.d/cakeshop.conf
#           sudo nginx -t && sudo systemctl reload nginx
# On Amazon Linux 2023 remove the default server block first if it clashes:
#           comment out the "server { ... }" in /etc/nginx/nginx.conf

# Your app-tier instances (PRIVATE IPs, one per Availability Zone). Add or remove lines as needed.
upstream cakeshop_app {
    server 10.0.11.10:3000 max_fails=3 fail_timeout=10s;
    server 10.0.12.10:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Rate limit for the API (per client IP)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name _;

    # --- Real client IP when behind the ALB ---------------------------------
    # Replace with your VPC CIDR so only the ALB can set X-Forwarded-For.
    set_real_ip_from 10.0.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /var/www/cakeshop;      # the contents of the frontend/ folder
    index index.html;

    # --- Security headers ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    # --- ALB target-group health check (does not touch the app tier) --------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API: proxy to the Node.js app tier -----------------------------------
    location /api/ {
        limit_req zone=api_zone burst=30 nodelay;

        proxy_pass http://cakeshop_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Pass the ALB's scheme through (https when the ALB terminates TLS)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # --- Static frontend ------------------------------------------------------
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---------------------------------------------------------------------------
