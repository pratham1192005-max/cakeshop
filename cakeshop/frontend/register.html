<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register – Sweet Crumbs</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" data-active="register"></header>
  <main>
    <div class="card form-card">
      <h1>Create account 🎂</h1>
      <p class="sub">Join Sweet Crumbs and start ordering.</p>
      <div id="form-msg" class="form-msg"></div>
      <form id="register-form" novalidate>
        <div class="form-group"><label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" autocomplete="name" required></div>
        <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="form-group"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div>
        <div class="form-row">
          <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required></div>
          <div class="form-group"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div>
        </div>
        <button class="btn btn-block" type="submit">Create Account</button>
      </form>
      <p class="form-foot">Already registered? <a href="login.html">Login</a></p>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
