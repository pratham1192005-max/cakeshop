<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Sweet Crumbs</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" data-active="login"></header>
  <main>
    <div class="card form-card">
      <h1>Welcome back 🍰</h1>
      <p class="sub">Log in to order your favourite cakes.</p>
      <div id="form-msg" class="form-msg"></div>
      <form id="login-form" novalidate>
        <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-block" type="submit">Login</button>
      </form>
      <p class="form-foot">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
